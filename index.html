<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO 기본(구글 SEO 스타터 가이드·네이버 서치어드바이저 권고 반영).
         SPA(CSR)라 정적 head가 크롤러에 가장 중요. canonical은 공식 주소(D-016)로
         고정해 이중 배포(Pages/Workers) 중복 콘텐츠를 해소한다. -->
    <title>농사다마 — 농촌 외국인 근로자를 위한 지역 생활정보·이웃 찾기</title>
    <meta
      name="description"
      content="농촌에서 일하는 외국인 계절근로자가 내 언어로 병원·마트·행정·교통 생활정보를 지도에서 찾고, 같은 지역 이웃과 연결되는 무료 서비스. Local life info and neighbors for foreign seasonal workers in rural Korea."
    />
    <link rel="canonical" href="https://nongsadama.casualpe.workers.dev/" />

    <!-- Open Graph (네이버·카카오·메신저 공유 미리보기) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="농사다마 NongsaDama" />
    <meta property="og:title" content="농사다마 — 농촌 외국인 근로자를 위한 지역 생활정보·이웃 찾기" />
    <meta
      property="og:description"
      content="내 언어로 지역 생활정보를 지도에서 찾고, 같은 지역 이웃과 연결되세요. 무료입니다."
    />
    <meta property="og:url" content="https://nongsadama.casualpe.workers.dev/" />
    <meta property="og:image" content="https://nongsadama.casualpe.workers.dev/og-image.png" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary" />

    <!-- 구조화 데이터: 웹앱 기본 정보 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "농사다마 NongsaDama",
        "url": "https://nongsadama.casualpe.workers.dev/",
        "description": "농촌 외국인 계절근로자를 위한 다국어 지역 생활정보·이웃 찾기 웹앱",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Web",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "KRW" },
        "inLanguage": ["ko", "en"]
      }
    </script>

    <!-- 파비콘: 운영자 원본(favicon.svg, PNG 내장 5.7MB)에서 축소 생성 — 원본은 커밋하지 않음(PRD 11.3) -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script type="text/javascript">
      // Microsoft Clarity (세션 분석) — 로컬 개발(localhost)은 제외해 통계 오염 방지.
      // SPA이므로 이 한 곳으로 모든 페이지가 측정된다(Clarity가 라우트 변경 자동 추적).
      // 제3자 전송이므로 개인정보 처리방침 고지 목록에 포함(§10-J).
      (function () {
        var h = location.hostname;
        if (h === 'localhost' || h === '127.0.0.1') return;
        (function (c, l, a, r, i, t, y) {
          c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); };
          t = l.createElement(r); t.async = 1; t.src = 'https://www.clarity.ms/tag/' + i;
          y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
        })(window, document, 'clarity', 'script', 'xvb0klm2wu');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
