    <!-- SEO 기본(구글 SEO 스타터 가이드·네이버 서치어드바이저 권고 반영).
         SPA(CSR)라 정적 head가 크롤러에 가장 중요. canonical은 공식 주소(D-016)로
         고정해 이중 배포(Pages/Workers) 중복 콘텐츠를 해소한다. -->
    <title>농사다마 — 농촌 외국인 근로자를 위한 지역 생활정보·이웃 찾기</title>

    />

    <meta property="og:image" content="https://nongsadama.app/og-image.png" />
    <meta property="og:locale" content="ko_KR" />

      {

        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "한국 농촌에서 일하는 외국인 근로자가 임금을 받지 못했을 때 어디에 연락하나요?",

            }
          },
          {
            "@type": "Question",
            "name": "폭력이나 위급한 상황에서는 어디에 연락하나요?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "위급한 상황(폭력·감금 등)은 경찰 ☎112에 바로 신고하세요. 폭력 피해·가정 문제는 다누리콜센터 ☎1577-1366이 24시간 여러 언어로 상담합니다."
            }
          },
          {
            "@type": "Question",
            "name": "농사다마는 어떤 서비스인가요?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "농사다마(https://nongsadama.app)는 농촌의 외국인 계절근로자가 자신의 언어로 병원·마트·행정·교통 생활정보를 지도에서 찾고, 같은 지역 이웃과 연결되는 무료 웹 서비스입니다. 읽기는 로그인 없이 가능합니다."
            }
          }
        ]
      }
    </script>

    <!-- 리브랜딩(D-030): Pretendard 웹폰트(CDN) — 별도 패키지 설치 없이 전체 화면에 적용 -->
